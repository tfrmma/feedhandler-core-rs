[package]
name        = "feedhandler"
version     = "0.1.0"
edition     = "2021"
description = "HFT Normalized Feedhandler Core, zero-alloc, lock-free, bare-metal"
# Cargo auto-discovers anything under benches/ as a bench target by default,
# which would try to build latency.rs (and fail on the unresolved criterion
# import) on every `cargo build`/`cargo test`/`cargo clippy`, criterion is
# opt-in below. Off until you uncomment the dev-dependency and [[bench]]
# entry together.
autobenches = false

[dependencies]
# Zero external runtime dependencies, all hot-path code is self-contained.

[dev-dependencies]
# Requires rustc >= 1.80 (criterion 0.5 depends on half 2.x).
# On bare-metal targets: `rustup default stable` (>= 1.80) and uncomment:
# criterion = { version = "0.5", features = ["html_reports"] }
proptest = { version = "=1.4.0", default-features = false, features = ["std"] }

# [[bench]]
# name    = "latency"
# harness = false

# loom only compiles in when running the loom model checker, see
# tests/loom_ring_buffer.rs and RUSTFLAGS="--cfg loom" in the README.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[profile.release]
opt-level     = 3
lto           = "fat"       # whole-program LTO
codegen-units = 1           # single CGU maximises cross-module inlining
panic         = "abort"     # strips unwinding infrastructure
debug         = false

[profile.bench]
inherits = "release"
debug    = true             # retain frame pointers for perf(1) / vtune
